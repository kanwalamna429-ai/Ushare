services:
  - type: web
    name: ushare-api
    runtime: node
    plan: free
    buildCommand: npm install -g pnpm && pnpm install --frozen-lockfile && pnpm --filter @workspace/api-server run build
    startCommand: node --enable-source-maps artifacts/api-server/dist/index.mjs
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SESSION_SECRET
        generateValue: true

  - type: web
    name: ushare-frontend
    runtime: static
    plan: free
    buildCommand: npm install -g pnpm && pnpm install --frozen-lockfile && BASE_PATH=/ pnpm --filter @workspace/social-poster run build
    staticPublishPath: ./artifacts/social-poster/dist/public
    envVars:
      - key: BASE_PATH
        value: /
    routes:
      - type: rewrite
        source: /api/*
        destination: https://ushare-api.onrender.com/api/$1
      - type: rewrite
        source: /*
        destination: /index.html
